name: tasks

on:
  push:
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.list.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "tasks=$(ls -d tasks/t*_* | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.discover.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tasks/requirements.txt
      - run: pip install -r tasks/requirements.txt
      - name: pytest ${{ matrix.task }}
        working-directory: tasks/${{ matrix.task }}
        run: python -m pytest -q
